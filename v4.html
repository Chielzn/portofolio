<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Banten - CHIELZN</title></head><body style="background:#0a0e1a;color:#fff;font-family:sans-serif;text-align:center;padding:40px 20px"><div style="background:#111a33;padding:30px;border-radius:20px;max-width:380px;margin:auto;border:1px solid #1e2d5a"><h1 style="color:#00d4ff;margin:0">🎮 Tebak 1-100</h1><p>Banten Pride - Tebak angka gua!</p><input id=t type=number placeholder="??" style="padding:12px;border-radius:10px;border:none;width:100px;text-align:center;font-size:22px;margin:10px"><br><br><button onclick=c() style="padding:12px 22px;border-radius:20px;border:none;background:#00d4ff;font-weight:bold;cursor:pointer">Tebak! 🔥</button> <button onclick=r() style="padding:12px 18px;border-radius:20px;border:1px solid #2a3a6a;background:#1a223f;color:#fff">Ulang</button><div id=m style="margin-top:20px;font-weight:bold;font-size:18px;min-height:30px"></div><p id=n style="color:#888"></p><a href="./v2.html" style="color:#555;font-size:12px;text-decoration:none">← Balik ke IOTX Tracker Rp76</a></div><script>let a=Math.floor(Math.random()*100)+1,ny=7;document.getElementById('n').innerText='Nyawa: '+ny+' 🔥';function c(){let t=parseInt(document.getElementById('t').value);if(!t){m.innerText='Isi dulu woy!';return}ny--;if(t==a){m.innerText='ANJIR BENER! '+a+'! Banten Pride! 🔥🔥';m.style.color='#00d4ff'}else if(ny<=0){m.innerText='GAME OVER! Angkanya '+a+'! Coba lagi!'}else if(t<a){m.innerText='Kekecilan woy! Naikin! Sisa '+ny}else{m.innerText='Kegedean woy! Turunin! Sisa '+ny}n.innerText='Nyawa: '+ny+' 🔥'}function r(){a=Math.floor(Math.random()*100)+1;ny=7;m.innerText='';n.innerText='Nyawa: '+ny+' 🔥';t.value=''}</script></body></html>
