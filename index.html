<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio IOTX - All in One</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-4">
<div class="max-w-md mx-auto">
<h1 class="text-2xl font-bold text-center mt-4">PORTOFOLIO SULTAN 🔥</h1>
<div class="flex gap-2 justify-center mt-6 flex-wrap">
<button onclick="showV('v1')" id="btn-v1" class="px-4 py-2 bg-blue-600 rounded-full font-bold">v1 LIVE</button>
<button onclick="showV('v2')" id="btn-v2" class="px-4 py-2 bg-gray-800 rounded-full">v2 SAPA</button>
<button onclick="showV('v3')" id="btn-v3" class="px-4 py-2 bg-gray-800 rounded-full">v3 JUALAN</button>
<button onclick="showV('v4')" id="btn-v4" class="px-4 py-2 bg-gray-800 rounded-full">v4 AUTO</button>
</div>

<div id="v1" class="mt-8 p-6 bg-gray-900 rounded-xl text-center">
<h2 class="font-bold">IOTX LIVE AUTO</h2>
<p id="price" class="text-2xl font-bold mt-4">Loading...</p>
<p id="change" class="mt-2">--</p>
<p id="lastUpdate" class="text-xs text-gray-500 mt-2">--</p>
</div>

<div id="v2" class="hidden mt-8 p-6 bg-gray-900 rounded-xl text-center">
<h2 class="text-2xl font-bold">Woy Kozell! 👋</h2>
<p class="mt-2 text-gray-400">Versi nyapa, dulu pernah viral di HP lu</p>
</div>

<div id="v3" class="hidden mt-8 p-6 bg-gray-900 rounded-xl text-center">
<h2 class="text-2xl font-bold">Jualan Sultan 💰</h2>
<p class="mt-2">IOTX to the moon! 🚀</p>
<p class="mt-4 p-3 bg-green-600 rounded">BELI DI BAWAH Rp100!</p>
</div>

<div id="v4" class="hidden mt-8 p-6 bg-gray-900 rounded-xl text-center">
<h2 class="text-2xl font-bold">v4 AUTO SULTAN ✨</h2>
<p id="price2" class="text-xl font-bold mt-4">Loading...</p>
<p class="mt-2 text-xs text-gray-400">Sama kayak v1, tapi versi paling baru</p>
</div>
</div>

<script>
function showV(v){
  ['v1','v2','v3','v4'].forEach(x=>{
    document.getElementById(x).classList.add('hidden');
    document.getElementById('btn-'+x).className='px-4 py-2 bg-gray-800 rounded-full';
  });
  document.getElementById(v).classList.remove('hidden');
  document.getElementById('btn-'+v).className='px-4 py-2 bg-blue-600 rounded-full font-bold';
}
async function getIOTX(){
  try{
    let r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=iotex&vs_currencies=usd,idr&include_24hr_change=true');
    let d = await r.json();
    let txt = '$'+d.iotex.usd+' / Rp '+d.iotex.idr.toLocaleString('id-ID');
    document.getElementById('price').innerHTML=txt;
    if(document.getElementById('price2')) document.getElementById('price2').innerHTML=txt;
    let c = d.iotex.usd_24h_change;
    let el = document.getElementById('change');
    if(c>0){ el.innerHTML='↗️ +'+c.toFixed(2)+'%'; el.className='mt-2 text-green-400 font-bold animate-pulse'; }
    else{ el.innerHTML='↘️ '+c.toFixed(2)+'%'; el.className='mt-2 text-red-400 font-bold animate-pulse'; }
    document.getElementById('lastUpdate').innerText='Update: '+new Date().toLocaleTimeString('id-ID')+' WIB';
  }catch(e){}
}
getIOTX();
setInterval(getIOTX,10000);
</script>
</body>
</html>
